name: October 2026 movie post review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-bot-october-2026-review
  cancel-in-progress: false

jobs:
  generate-october-review:
    name: Generate October review package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
      WEBSITE_URL: https://90minutemovie.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install card font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fL --retry 3 \
            'https://github.com/google/fonts/raw/main/ofl/robotoflex/RobotoFlex%5BGRAD%2CXOPQ%2CXTRA%2CYOPQ%2CYTAS%2CYTDE%2CYTFI%2CYTLC%2CYTUC%2Copsz%2Cslnt%2Cwdth%2Cwght%5D.ttf' \
            -o ~/.local/share/fonts/RobotoFlex.ttf
          fc-cache -f

      - name: Generate October review
        run: npm run bot:queue:october-2026:review

      - uses: actions/upload-artifact@v4
        with:
          name: october-2026-movie-post-review
          path: bot-october-review/
          if-no-files-found: error
